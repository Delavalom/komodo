# Cutting a release.
#
#   1. bump the version in the four places `pnpm check:release` checks
#   2. commit, merge to main
#   3. git tag v0.4.0 && git push origin v0.4.0
#
# A manual run builds and validates both artifacts but never publishes them.
# Only a matching v* tag push can publish to npm or GHCR.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a tag that matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $declared." >&2
            exit 1
          fi

  verify:
    name: Verify release commit
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  npm:
    name: Build npm package
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm signs the tarball against this workflow run.
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the release in dependency order
        run: pnpm build:release

      - name: Pack the verified CLI
        run: pnpm --filter komodo-review pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish "$RUNNER_TEMP"/komodo-review-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Inspect the npm package without publishing
        if: github.event_name == 'workflow_dispatch'
        # `npm publish --dry-run` still asks the registry whether this exact
        # version can be published. That makes a manual check fail as soon as
        # the version already exists. `npm pack` inspects the same tarball
        # locally and is safe to repeat.
        run: npm pack "$RUNNER_TEMP"/komodo-review-*.tgz --dry-run --json

  image:
    name: Build container image
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the container builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dry-run-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and optionally publish the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
