# Cutting a release.
#
#   1. bump the version in the four places `pnpm check:release` checks
#   2. commit, merge to main
#   3. git tag v0.4.0 && git push origin v0.4.0
#
# The tag is the trigger and the source of truth: the job refuses to publish
# if it does not match what the manifests say, so a tag can never ship a
# version nobody bumped.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance: npm signs the tarball against this workflow run, so the
      # registry page can say which commit and which job produced it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:release

      - name: Tag matches the manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $declared." >&2
            exit 1
          fi

      # The web app first: packages/cli's prepack refuses to build a tarball
      # without a standalone build to put in it, and `pnpm -r build` does not
      # know the CLI comes last.
      - run: pnpm build:release

      # pnpm packs (it rewrites the workspace: protocol npm cannot read); npm
      # publishes (it is the one that can attach provenance).
      - name: Pack
        run: pnpm --filter komodo-review pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP"/komodo-review-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ github.event_name != 'push' && inputs.dry_run }}
        run: npm publish "$RUNNER_TEMP"/komodo-review-*.tgz --dry-run --access public

  image:
    # The team deployment, so nobody has to build it from source. Independent
    # of the npm job: a registry outage should not cost the image, or vice
    # versa.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
