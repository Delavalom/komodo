# Komodo code review configuration — https://github.com/Delavalom/komodo
provider: codex        # auto | claude | codex
profile: chill        # chill (signal only) | assertive (thorough)
min_severity: minor   # critical | major | minor | trivial

# path_filters:       # extra globs; "!" excludes. Lockfiles/dist/binaries are excluded by default.
#   - "!docs/**"
# path_instructions:
#   - path: "src/api/**"
#     instructions: "Check authorization and input validation on every handler."

# Every judgement, summary and comment is written in one house voice — see
# VOICE_STYLE.md at the repository root. `voice.extra` adds a team's own
# vocabulary after it; it does not replace it.
# voice:
#   extra: |
#     We call the Temporal side "workflows" and "activities", never "jobs".

# Company-wide review guidance that lives outside any one repository — how to
# review, how to gather context, how the AI should use specific tools. Every
# *.md under a source is handed to the reviewer, narrowed by its own
# frontmatter (`repos:`, `clusters:`, `globs:`) if it has any. Run
# `komodo context` to see what this resolves to.
# context:
#   sources:
#     - type: path
#       name: Company review rules
#       path: ../review-guidelines   # relative to this file; ~ is expanded

# What the poller reviews without being asked. Both are off: the first pass over
# a repository observes every open pull request as new, and a queue is cheaper to
# fill than a subscription is to refill. Each row has "Review with AI", and
# Settings → Review owns these two once the store has adopted this file.
# auto_review:
#   new_pull_requests: false   # review a pull request the poller has never seen
#   on_new_commits: false      # re-review when the head moves
#   drafts: false
#   max_files: 100             # 0 disables the cap
#   authors:                   # `include` reviews only these logins; `exclude` skips them
#     mode: exclude
#     tokens: ["dependabot[bot]"]

post:
  # What GitHub gets. The review itself lives in Komodo, where a judgement can
  # actually be answered.
  #   receipt — one comment: the verdict and a link back here (default)
  #   full    — walkthrough plus an inline comment per judgement
  #   none    — post nothing
  mode: receipt
  update_description: false   # inject "Summary by Komodo" into the PR description (mode: full)
  status_check: false         # post a pending status until human verification is recorded

# Who the queue is for, and what it watches. `komodo pr` does not need this;
# `komodo dev` and `komodo serve` do — without a team they have nothing to poll.
# Repositories under the same owners are discovered on a later pass and listed
# under Settings → Manage Repositories, switched off until someone enables them
# (or on, with Repo Settings → Auto-enable new repos).
#
team:
  name: Integrations
  you: Delavalom
  members:
    - MiguelSilva1997
    - Delavalom
    - neildowgun-ff
  repos:
    - ForwardFinancing/third_party_integrations
    - ForwardFinancing/integration_dispatcher
    - ForwardFinancing/ml_data_provider

local:
  url: http://localhost:4400  # where the queue is reachable; the receipt links here
