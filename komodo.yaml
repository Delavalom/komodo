# Komodo code review configuration — https://github.com/Delavalom/komodo
provider: auto        # auto | claude | codex
profile: chill        # chill (signal only) | assertive (thorough)
min_severity: minor   # critical | major | minor | trivial

# path_filters:       # extra globs; "!" excludes. Lockfiles/dist/binaries are excluded by default.
#   - "!docs/**"
# path_instructions:
#   - path: "src/api/**"
#     instructions: "Check authorization and input validation on every handler."

post:
  # What GitHub gets. The review itself lives in Komodo, where a judgement can
  # actually be answered.
  #   receipt — one comment: the verdict and a link back here (default)
  #   full    — walkthrough plus an inline comment per judgement
  #   none    — post nothing
  mode: receipt
  update_description: false   # inject "Summary by Komodo" into the PR description (mode: full)
  request_changes: true       # request changes when major/critical findings exist (mode: full)
  status_check: false         # post a commit status (pass/fail gate)

# Who the queue is for, and what it watches. `komodo pr` does not need this;
# `komodo dev` and `komodo serve` do — without a team they have nothing to poll.
# Repositories under the same owners are discovered on a later pass and listed
# under Settings → Manage Repositories, switched off until someone enables them
# (or on, with Repo Settings → Auto-enable new repos).
#
# team:
#   name: Core Infra
#   you: your-github-login
#   members:
#     - your-github-login
#   repos:
#     - your-org/your-repo

local:
  url: http://localhost:4400  # where the queue is reachable; the receipt links here
